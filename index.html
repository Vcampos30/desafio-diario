function formatDateLong(ds){return dateObj(ds).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}
function saveDayEditor(ds){
  let vals={};
  for(const x of active()){vals[x.id]=Math.max(0,parseInt(document.getElementById('day_'+x.id)?.value||0));}
  const complete=req().length>0&&req().every(x=>vals[x.id]>=targetForDate(x,ds));
  const prev=data.entries[ds];
  const reward=rewardForHistorical(vals,complete,ds);
  const oldXp=Number(prev?.xp||0);
  const deltaXp=reward.xp-oldXp;
  if(deltaXp){data.xp+=deltaXp;data.historyXP.push({date:ds,xp:deltaXp,reason:'Ajuste de registro'});}
  data.entries[ds]={values:vals,complete,protected:false,xp:reward.xp,coins:Number(prev?.coins||0),updatedAt:new Date().toISOString(),historical:ds<today()};

function buy(id){let it=ITEMS()[id];if(!it)return;if(data.coins<it.price){toast('🪙 Moedas insuficientes.');return}data.coins-=it.price;data.inventory[id]=(data.inventory[id]||0)+1;save();toast(`${it.icon} Item comprado!`);render()}
function useItem(id){let it=ITEMS()[id];if(!it||!(data.inventory[id]>0)){toast('Você não possui esse item.');return}if(['shield','freeze'].includes(id)){if(data.entries[today()]){toast('Hoje já possui um registro.');return}data.entries[today()]={values:{},complete:false,protected:true,xp:0,coins:0};data.inventory[id]--}else if(id==='rest'){data.entries[today()]={values:{},complete:true,protected:true,xp:0,coins:0,rest:true};data.inventory[id]--}else if(['reroll','wildcard'].includes(id)){data.challenges[today()]={list:null,claimed:{},rerolls:(data.challenges[today()]?.rerolls||0)+1};data.inventory[id]--}else if(['challengeXP2','challengeCoins2','lucky','secondWind'].includes(id)){data.upgrades[id]=true;data.inventory[id]--}else if(id==='mystery'){let gain=200+Math.floor(Math.random()*801);data.coins+=gain;data.inventory[id]--;toast(`🎁 Caixa misteriosa: +${gain} 🪙`)}else if(it.use==='exerciseCoins'){data.upgrades['exerciseCoins_'+it.exercise]=true;data.inventory[id]--}else if(it.use==='exerciseEase'){data.upgrades['exerciseEase_'+it.exercise]=true;data.inventory[id]--}else if(it.use==='exerciseXP'){data.upgrades['exerciseXP_'+it.exercise]=true;data.inventory[id]--}else if(it.use==='exerciseCoinFlat'){data.upgrades['exerciseCoinFlat_'+it.exercise]=true;data.inventory[id]--}else if(it.use==='cosmetic'){data.upgrades['cosmetic_'+id]=true;data.inventory[id]--;toast('✨ Colecionável ativado!')}else if(it.use==='proTheme'){data.pro.theme=it.theme;data.inventory[id]--;applyProTheme();toast('🎨 Tema PRO ativado!')}else if(it.use==='proTitle'){data.pro.title='Inquebrável';data.inventory[id]--;toast('👑 Título PRO equipado!')}else if(it.use==='proSeason'){data.pro.season.xp=(data.pro.season.xp||0)+500;data.inventory[id]--;toast('🏁 Passe da temporada ativado!')}save();render()}

function renderSeason(){if(!isPro()){document.getElementById('season').innerHTML='';return}let st=seasonStats(),s=proSeasonStatus();let rewards=[['5','🏅','Distintivo do Sobrevivente','Colecionável'],['10','🔥','Chama Crescente','+100 XP de temporada'],['15','🎯','Caçador de Desafios','Título especial'],['20','🩸','Blood Cache','Item raro'],['25','👑','Inquebrável','Título épico'],['30','☠️','Skull Master','Recompensa lendária']];document.getElementById('season').innerHTML=`<div class="card hero heroSkull"><div class="eyebrow">Conteúdo PRO</div><div class="day">🏁 Temporada Skull I</div><div class="muted">Uma jornada premium de 30 dias. Complete seus dias normais para avançar e desbloquear marcos.</div><div class="bar"><i style="width:${st.progress}%"></i></div><div class="barline"><span>${st.done}/30 dias concluídos</span><span>⭐ ${fmt(st.xp)} XP</span></div></div><div class="card proCard"><div class="proHead"><div><div class="proBadge">☠️ PRO ATIVO</div><div class="sectiontitle" style="margin-top:8px">Progresso da temporada</div><div class="muted">Início: ${formatDateLong(st.start)} · Dia ${Math.min(30,s.elapsed)} de 30</div></div><span class="proState proActive">${st.progress}%</span></div><div class="miniGrid" style="margin-top:12px"><div class="mini"><span class="muted">DIAS</span><b>${st.done}/30</b></div><div class="mini"><span class="muted">XP DA TEMPORADA</span><b>⭐ ${fmt(st.xp)}</b></div><div class="mini"><span class="muted">TEMPO RESTANTE</span><b>${Math.max(0,30-st.elapsed)} dias</b></div></div></div><div class="card"><div class="sectiontitle">🎁 Marcos e recompensas</div><div class="statsgrid">${rewards.map(r=>{let n=Number(r[0]),ok=st.done>=n;return `<div class="stat" style="border-color:${ok?'rgba(134,239,172,.35)':'var(--line)'}"><div style="font-size:26px">${r[1]}</div><small>DIA ${n}</small><strong>${r[2]}</strong><div class="muted" style="margin-top:5px">${r[3]}</div><span class="badge" style="margin-top:8px;display:inline-block">${ok?'✓ Desbloqueado':'🔒 Bloqueado'}</span></div>`}).join('')}</div></div><div class="card"><div class="sectiontitle">📅 Linha da temporada</div><div class="miniGrid">${st.arr.map(x=>`<div class="mini" style="opacity:${x.day>st.elapsed?'.48':'1'};border-color:${x.done?'rgba(34,197,94,.3)':x.day===st.elapsed?'rgba(239,68,68,.4)':'var(--line)'}"><span class="muted">DIA ${x.day}</span><b>${x.done?'✅ Completo':x.day>st.elapsed?'🔒 Futuro':'⬜ Pendente'}</b><div class="muted" style="font-size:10px;margin-top:4px">${formatDateLong(x.date)}</div></div>`).join('')}</div></div><div class="card"><div class="sectiontitle">💡 Como funciona</div><div class="list"><div class="row"><span>🎯 Complete seu treino normal</span><span class="badge">Conta</span></div><div class="row"><span>⭐ XP do treino alimenta a temporada</span><span class="badge">Automático</span></div><div class="row"><span>🎁 Marcos liberam recompensas premium</span><span class="badge">30 dias</span></div></div></div>`}

function renderProfile(){let l=levelInfo(),s=streak(),items=ITEMS(),effects=Object.keys(data.upgrades).filter(k=>data.upgrades[k]),season=proSeasonStatus();let themeOptions=[['skull','☠️','Skull'],['blood','🩸','Blood'],['ember','🔥','Ember'],['ice','❄️','Ice']];document.getElementById('profile').innerHTML=`<div class="card hero heroSkull"><div class="eyebrow">Meu perfil</div><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><div class="day">☠️ Nível ${l.lv}</div><div class="muted">${levelName(l.lv)} · Prestígio ${data.prestige} · Foco: ${esc(data.settings.goal||'Consistência')}</div></div><span class="proState ${isPro()?'proActive':''}">${isPro()?'☠️ PRO':'FREE'}</span></div><div class="bar"><i style="width:${l.within/l.need*100}%"></i></div><div class="barline"><span>${l.within} / ${l.need} XP</span><span>⭐ ${fmt(data.xp)}</span></div></div><div class="card proCard"><div class="proHead"><div><div class="proBadge">☠️ ${isPro()?'PRO ATIVO':'PRO'}</div><div class="sectiontitle" style="margin-top:8px">${isPro()?'Tudo desbloqueado na demonstração':'Pronto para evoluir'}</div><div class="muted">${isPro()?'Motor premium, insights, temporada e personalização estão ativos localmente.':'Desbloqueie a camada comercial do produto sem perder o modo gratuito.'}</div></div><button class="promoButton" onclick="showProModal()">${isPro()?'Gerenciar':'Conhecer'}</button></div>${isPro()?`<div class="season" style="margin-top:12px"><div><b>🏁 Temporada Skull I</b><div class="seasonProgress">${season.prog}% concluído · ${Math.min(30,season.elapsed)}/30 dias</div></div><span class="badge">${data.pro.plan?proProductLabel(data.pro.plan):'PRO'}</span></div><div class="card" style="margin:12px 0 0;background:#111114"><div class="sectiontitle">🎨 Personalização PRO</div><div class="muted">Escolha a identidade visual premium deste aparelho.</div><div class="themeGrid">${themeOptions.map(t=>`<button class="themeBtn ${data.pro.theme===t[0]?'active':''}" onclick="setProTheme('${t[0]}')"><span class="themeDot" style="background:${t[0]==='skull'?'#ef4444':t[0]==='blood'?'#7f1d1d':t[0]==='ember'?'#f59e0b':'#38bdf8'}"></span><b>${t[1]} ${t[2]}</b></button>`).join('')}</div></div><div class="syncBox" style="margin-top:12px"><b>☁️ Sincronização</b><div class="muted" style="margin:4px 0 8px">Hoje: ${data.pro.lastSyncAt?new Date(data.pro.lastSyncAt).toLocaleString('pt-BR'):'nunca simulada'}</div><code>store.kit → subscription state → cloud profile → Apple/iCloud adapter</code><button class="secondary" style="margin-top:9px" onclick="syncSnapshot()">Simular sincronização</button></div>`:''}</div><div class="card"><div class="sectiontitle">📊 Seus números</div><div class="statsgrid"><div class="stat"><small>SEQUÊNCIA ATUAL</small><strong>🔥 ${s.cur}</strong></div><div class="stat"><small>MELHOR</small><strong>🏆 ${s.best}</strong></div><div class="stat"><small>MOEDAS</small><strong>🪙 ${fmt(data.coins)}</strong></div><div class="stat"><small>CONQUISTAS</small><strong>🏆 ${ACH.filter(a=>a[4]()).length}/${ACH.length}</strong></div></div></div><div class="card"><div class="sectiontitle">🎒 Inventário</div><div class="list">${Object.entries(items).filter(([id])=>data.inventory[id]>0).map(([id,it])=>`<div class="row"><span>${it.icon} ${it.name} <span class="badge">${data.inventory[id]}</span></span><button class="secondary" onclick="useItem('${id}')">Usar</button></div>`).join('')||'<div class="muted">Inventário vazio. A loja está esperando.</div>'}</div></div><div class="card"><div class="sectiontitle">⚡ Efeitos ativos</div><div class="list">${effects.map(k=>`<div class="row"><span>✨ ${k}</span><span class="badge">ativo</span></div>`).join('')||'<div class="muted">Nenhum efeito ativo.</div>'}</div></div>`}

function renderSettings(){let proPanel=isPro()?`<div class="card proCard"><div class="proHead"><div><div class="proBadge">☠️ PRO ATIVO</div><div class="sectiontitle" style="margin-top:8px">Central premium</div><div class="muted">A camada comercial está rodando localmente. Aqui ficarão as preferências, assinatura e integrações do produto.</div></div><span class="proState proActive">${proProductLabel(data.pro.plan||'monthly')}</span></div><div class="miniGrid" style="margin-top:12px"><div class="mini"><span class="muted">STATUS</span><b>Ativo</b></div><div class="mini"><span class="muted">FONTE</span><b>Demo local</b></div><div class="mini"><span class="muted">SYNC</span><b>${data.pro.lastSyncAt?'Pronto':'Não usada'}</b></div></div><div class="actions"><button class="secondary" onclick="syncSnapshot()">☁️ Simular sync</button><button class="secondary" onclick="showProModal()">Gerenciar PRO</button></div></div>`:`<div class="card proCard"><div class="proHead"><div><div class="proBadge">☠️ EDIÇÃO COMERCIAL</div><div class="sectiontitle" style="margin-top:8px">PRO pronto para teste</div><div class="muted">Ative o modo demonstração e explore a experiência premium sem publicar o app e sem cobrança real.</div></div><button class="promoButton" onclick="showProModal()">Explorar PRO</button></div></div>`;document.getElementById('settings').innerHTML=`<div class="card"><div class="sectiontitle">🏋️ Exercícios</div><div class="list">${data.exercises.map(x=>`<div class="row"><span>${x.icon} <b>${esc(x.name)}</b><div class="muted">${x.target}${x.type==='time'?'s':' reps'} · +${x.inc} por nível · ${x.required?'obrigatório':'opcional'}</div></span><span><button class="secondary" onclick="editExercise('${x.id}')">Editar</button> <button class="secondary" onclick="toggleExercise('${x.id}')">${x.active?'Desativar':'Ativar'}</button></span></div>`).join('')}</div><button class="primary" style="margin-top:10px" onclick="editExercise()">＋ Novo exercício</button></div><div class="card"><div class="sectiontitle">⚙️ Regras</div><label class="muted">Dias por nível</label><input id="daysLevel" type="number" min="1" value="${data.cfg.daysPerLevel}"><button class="primary" style="margin-top:10px" onclick="saveRule()">Salvar regra</button></div><div class="card"><div class="sectiontitle">💾 Dados</div><div class="actions"><button class="secondary" onclick="exportData()">⬇️ Exportar backup</button><label class="secondary" style="display:inline-block">⬆️ Importar <input id="importFile" type="file" accept="application/json" onchange="importData(event)" style="display:none"></label></div></div>${proPanel}<div class="card"><div class="sectiontitle">⚠️ Zona de reset</div><div class="muted">Volta o progresso ao marco zero e também limpa exercícios personalizados, loja, desafios, XP, moedas e histórico.</div><button class="danger" style="margin-top:10px;width:100%" onclick="resetProgress()">🗑️ Resetar tudo</button></div>`}

function resetProgress(){if(!confirm('Tem certeza que quer voltar todo o aplicativo para o marco zero?'))return;if(!confirm('Última confirmação: todo o progresso, exercícios personalizados, XP, moedas, desafios e histórico serão apagados.'))return;data=clone(defaultData);save();currentView='today';render();toast('🔄 Tudo voltou para o marco zero.')}
function saveRule(){data.cfg.daysPerLevel=Math.max(1,parseInt(document.getElementById('daysLevel').value)||5);save();toast('Regra salva.');render()}
function toggleExercise(id){let x=data.exercises.find(e=>e.id===id);if(x){x.active=!x.active;save();render()}}
function editExercise(id){let x=id?data.exercises.find(e=>e.id===id):{id:'ex_'+Date.now(),name:'',icon:'🏋️',type:'reps',target:10,inc:2,active:true,required:true};document.getElementById('modalbox').innerHTML=`<h2>${id?'✏️ Editar':'➕ Novo'} exercício</h2><div class="formgrid"><div class="full"><label>Nome</label><input id="f_name" value="${esc(x.name)}"></div><div><label>Ícone</label><input id="f_icon" value="${esc(x.icon)}"></div><div><label>Tipo</label><select id="f_type" onchange="toggleTimeField()"><option value="reps" ${x.type==='reps'?'selected':''}>Repetições</option><option value="time" ${x.type==='time'?'selected':''}>Tempo</option></select></div><div id="repTargetField"><label>Meta inicial</label><input id="f_target" type="number" min="1" value="${x.type==='reps'?x.target:10}"></div><div id="timeTargetField" style="display:${x.type==='time'?'block':'none'}"><label>Tempo inicial (segundos)</label><input id="f_time" type="number" min="1" value="${x.type==='time'?x.target:30}"></div><div><label>Aumento por nível</label><input id="f_inc" type="number" min="0" value="${x.inc}"></div><div><label>Obrigatório?</label><select id="f_req"><option value="1" ${x.required?'selected':''}>Sim</option><option value="0" ${!x.required?'selected':''}>Não</option></select></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveExercise('${id||''}')">Salvar</button></div>`;openModal()}
function toggleTimeField(){let time=document.getElementById('f_type').value==='time';document.getElementById('timeTargetField').style.display=time?'block':'none';document.getElementById('repTargetField').style.display=time?'none':'block'}
function saveExercise(id){let x=id?data.exercises.find(e=>e.id===id):{id:'ex_'+Date.now()};x.name=document.getElementById('f_name').value.trim()||'Exercício';x.icon=document.getElementById('f_icon').value.trim()||'🏋️';x.type=document.getElementById('f_type').value;x.target=Math.max(1,parseInt(x.type==='time'?document.getElementById('f_time').value:document.getElementById('f_target').value)||1);x.inc=Math.max(0,parseInt(document.getElementById('f_inc').value)||0);x.required=document.getElementById('f_req').value==='1';x.active=true;if(!id)data.exercises.push(x);save();closeModal();toast('Exercício salvo.');render()}
function openSettings(){go('settings')}function openModal(){document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='desafio-diario-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data=normalize(JSON.parse(r.result));save();toast('Backup restaurado.');render()}catch{toast('Backup inválido.')}};r.readAsText(f)}
function updateNav(){let n=document.getElementById('navin'),b=document.getElementById('navSeason');if(n)n.classList.toggle('hasPro',isPro());if(b)b.style.display=isPro()?'block':'none';document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.v===currentView))}
function render(){renderToday();renderStats();renderAchievements();renderShop();renderChallenges();renderSeason();renderProfile();renderSettings();updateNav();if(isFreshInstall()&&!document.getElementById('modal').classList.contains('open'))showOnboarding()}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),2200)}
applyProTheme();render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
