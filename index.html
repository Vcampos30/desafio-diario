<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Desafio Diário</title><link rel="manifest" href="manifest.json"><style>
:root{--bg:#080d19;--card:#111827;--card2:#172033;--text:#f8fafc;--muted:#9aa7bd;--a:#8b5cf6;--b:#06b6d4;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--line:rgba(255,255,255,.08)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#080d19,#0b1220);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{border:0;cursor:pointer;color:var(--text)}.app{max-width:1050px;margin:auto;padding:16px 16px 92px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-weight:900;font-size:21px}.sub{font-size:12px;color:var(--muted)}.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}.view{display:none}.view.active{display:block}.card{background:rgba(17,24,39,.94);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 12px 40px rgba(0,0,0,.16)}.hero{background:linear-gradient(135deg,#151d31,#101827)}.dayrow{display:flex;justify-content:space-between;gap:12px}.eyebrow{color:#b9a5ff;text-transform:uppercase;font-size:11px;font-weight:800;letter-spacing:.08em}.day{font-size:42px;font-weight:950;line-height:1.05}.streak{color:#ffbd55;font-weight:700;margin-top:4px}.levelbox{text-align:right}.level{font-size:30px;font-weight:950}.muted{color:var(--muted)}.bar{height:10px;background:#273248;border-radius:99px;overflow:hidden;margin:16px 0 7px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:99px}.barline{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.exercisegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:15px}.exercise{background:var(--card2);border:1px solid var(--line);border-radius:15px;padding:14px}.exercise h3{margin:0 0 7px;font-size:14px}.target{font-size:30px;font-weight:900}.unit{font-size:11px;color:var(--muted)}input,select{width:100%;background:#0b1220;border:1px solid #2b3850;color:var(--text);border-radius:10px;padding:10px;margin-top:9px;outline:none}.actions{display:flex;gap:9px;margin-top:13px}.primary,.secondary,.danger{padding:11px 14px;border-radius:11px;font-weight:800}.primary{background:linear-gradient(90deg,#7c3aed,#5b21b6)}.secondary{background:#243047}.danger{background:#5b1d27}.status{margin-top:12px;padding:10px;border-radius:10px;background:#172033;color:var(--muted)}.success{color:#86efac}.warn{color:#fcd34d}.sectiontitle{font-size:18px;font-weight:900;margin-bottom:12px}.statsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}.stat{background:var(--card2);border-radius:13px;padding:12px;border:1px solid var(--line)}.stat small{color:var(--muted);display:block;font-size:10px;font-weight:800}.stat strong{display:block;font-size:22px;margin-top:4px}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:rgba(8,13,25,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center}.navin{max-width:1050px;width:100%;display:grid;grid-template-columns:repeat(6,1fr)}.nav button{background:none;color:var(--muted);padding:10px 3px 9px;font-size:11px}.nav button.active{color:#c4b5fd}.nav b{display:block;font-size:18px;margin-bottom:2px}.list{display:grid;gap:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card2);padding:11px;border-radius:12px}.badge{padding:5px 8px;border-radius:999px;background:#243047;font-size:11px}.green{color:#86efac}.gold{color:#fcd34d}.purple{color:#c4b5fd}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.open{display:flex}.modalbox{width:min(650px,100%);max-height:92vh;overflow:auto;background:#101827;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid .full{grid-column:1/-1}.shopgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.shop{background:var(--card2);border:1px solid var(--line);border-radius:15px;padding:14px}.shop .price{font-weight:900;color:#fcd34d;margin:9px 0}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap;background:#1c273b;padding:8px 11px;border-radius:999px;color:var(--muted)}.tabs button.on{background:#6d28d9;color:#fff}.achievement{display:flex;align-items:center;gap:10px;padding:11px;background:var(--card2);border-radius:12px;border:1px solid var(--line)}.achievement.lock{opacity:.42}.achgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.calhead{font-size:10px;color:var(--muted);text-align:center}.calday{aspect-ratio:1;border-radius:7px;background:#182238;display:grid;place-items:center;font-size:11px;border:1px solid transparent}.calday.done{background:#14532d}.calday.partial{background:#78350f}.calday.rest{background:#273248}.calday.protect{border-color:#a78bfa}.calday.today{outline:2px solid #8b5cf6}.chart{height:210px;width:100%;background:#0b1220;border-radius:13px;border:1px solid var(--line);padding:8px}.chart svg{width:100%;height:100%}.legend{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:11px}.toast{position:fixed;z-index:100;bottom:78px;left:50%;transform:translateX(-50%);background:#1f2937;border:1px solid var(--line);padding:11px 14px;border-radius:12px;display:none}.toast.show{display:block}@media(max-width:520px){.app{padding:12px 12px 92px}.day{font-size:35px}.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}.nav button{font-size:9px}.nav b{font-size:16px}}
</style></head><body><div class="app"><header class="top"><div><div class="brand">💪 Desafio Diário</div><div class="sub">Constância vence intensidade.</div></div><button class="iconbtn" onclick="openSettings()">⚙️</button></header>
<section id="today" class="view active"></section><section id="stats" class="view"></section><section id="achievements" class="view"></section><section id="shop" class="view"></section><section id="profile" class="view"></section><section id="settings" class="view"></section></div>
<nav class="nav"><div class="navin"><button data-v="today" onclick="go('today')"><b>🏠</b>Hoje</button><button data-v="stats" onclick="go('stats')"><b>📊</b>Stats</button><button data-v="achievements" onclick="go('achievements')"><b>🏆</b>Conquistas</button><button data-v="shop" onclick="go('shop')"><b>🏪</b>Loja</button><button data-v="profile" onclick="go('profile')"><b>👤</b>Perfil</button><button data-v="settings" onclick="go('settings')"><b>⚙️</b>Config.</button></div></nav><div id="modal" class="modal"><div class="modalbox" id="modalbox"></div></div><div id="toast" class="toast"></div>
<script>
const KEY='desafio_diario_v2';
const oldKey='desafio_diario_v1';
const defaultData={startDate:null,entries:{},cfg:{daysPerLevel:5},exercises:[{id:'push',name:'Flexões',icon:'💪',type:'reps',target:10,inc:2,active:true,required:true},{id:'sit',name:'Abdominais',icon:'🔥',type:'reps',target:10,inc:5,active:true,required:true}],xp:0,coins:0,level:1,prestige:0,inventory:{},upgrades:{},settings:{mission:true},missions:{},historyXP:[]};
let data=load();let currentView='today';
function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch{} if(d)return normalize(d);try{let o=JSON.parse(localStorage.getItem(oldKey)||'null');if(o){let n=clone(defaultData);n.startDate=o.startDate;n.entries={};for(const [date,e] of Object.entries(o.entries||{})){n.entries[date]={values:{push:e.push||0,sit:e.sit||0},complete:!!e.complete,protected:false,xp:(e.push||0)+(e.sit||0),coins:e.complete?30:10,updatedAt:e.updatedAt||new Date().toISOString()}}n.cfg.daysPerLevel=o.cfg?.daysPerLevel||5;n.exercises[0].target=o.cfg?.push||10;n.exercises[0].inc=o.cfg?.pushInc||2;n.exercises[1].target=o.cfg?.sit||10;n.exercises[1].inc=o.cfg?.sitInc||5;for(const [date,e] of Object.entries(n.entries)){n.xp+=(e.push||0)+(e.sit||0);n.coins+=e.complete?30:10}return n}}catch{}return clone(defaultData)}
function normalize(d){return {...clone(defaultData),...d,entries:d.entries||{},cfg:{...defaultData.cfg,...d.cfg},exercises:d.exercises?.length?d.exercises:clone(defaultData.exercises),inventory:{...d.inventory},upgrades:{...d.upgrades}}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function today(){return new Date().toLocaleDateString('en-CA')}
function dateObj(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){let d=dateObj(s);d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')}
function daysBetween(a,b){return Math.round((dateObj(b)-dateObj(a))/86400000)}
function active(){return data.exercises.filter(e=>e.active)}
function req(){return active().filter(e=>e.required)}
function completeCount(){return Object.values(data.entries).filter(e=>e.complete).length}
function streak(){let ds=Object.keys(data.entries).filter(k=>data.entries[k].complete||data.entries[k].protected).sort();let set=new Set(ds),cur=0,best=0;if(!ds.length)return{cur:0,best:0};let d=today();while(set.has(d)){cur++;d=addDays(d,-1)};for(let i=0;i<ds.length;i++){let c=1;while(set.has(addDays(ds[i],c)))c++;best=Math.max(best,c)}return{cur,best}}
function levelInfo(){let lv=Math.floor(data.xp/500)+1;let within=data.xp%500;return{lv,within,need:500}}
function award(xp,coins,reason){data.xp+=xp;data.coins+=coins;data.historyXP.push({date:today(),xp,reason});save()}
function targetFor(e){let completed=completeCount();let lvl=Math.floor(completed/data.cfg.daysPerLevel);return e.target+lvl*e.inc}
function fmt(n){return Number(n||0).toLocaleString('pt-BR')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function go(v){currentView=v;document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(v).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));render()}
function render(){renderToday();renderStats();renderAchievements();renderShop();renderProfile();renderSettings();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===currentView))}
function renderToday(){let t=document.getElementById('today'),e=data.entries[today()], lv=levelInfo(),st=streak(), reqs=req();let progress=reqs.length?reqs.filter(x=>e&&e.values?.[x.id]>=targetFor(x)).length/reqs.length*100:0;let cards=active().map(x=>{let val=e?.values?.[x.id]??'';let tar=targetFor(x);return `<div class="exercise"><h3>${x.icon} ${esc(x.name)} ${x.required?'':'<span class="badge">opcional</span>'}</h3><div class="target">${tar}${x.type==='time'?'s':''}</div><div class="unit">meta de hoje · ${x.type==='time'?'segundos':'repetições'}</div><input id="ex_${x.id}" type="number" min="0" inputmode="numeric" placeholder="Quanto fez?" value="${val}"></div>`}).join('');let mission=missionToday();t.innerHTML=`<div class="card hero"><div class="dayrow"><div><div class="eyebrow">Seu desafio de hoje</div><div class="day">Dia ${data.startDate?daysBetween(data.startDate,today())+1:1}</div><div class="streak">🔥 ${st.cur} dias seguidos</div></div><div class="levelbox"><div class="muted">Nível</div><div class="level">${lv.lv}</div><div class="muted">${levelName(lv.lv)}</div></div></div><div class="bar"><i style="width:${Math.min(100,lv.within/lv.need*100)}%"></i></div><div class="barline"><span>${fmt(lv.within)} / ${fmt(lv.need)} XP</span><span>⭐ ${fmt(data.xp)}</span></div><div class="exercisegrid">${cards||'<div class="muted">Adicione um exercício em Configurações.</div>'}</div><div class="actions"><button class="primary" onclick="saveToday()">✅ Registrar treino</button><button class="secondary" onclick="clearToday()">Limpar</button></div><div class="status ${e?.complete?'success':e?'warn':''}">${e?e.complete?`✅ Meta cumprida! +${fmt(e.xp)} XP · +${fmt(e.coins)} 🪙`:`⚠️ Treino parcial · complete os exercícios obrigatórios para fechar o dia.`:'Registre o treino de hoje para começar.'}</div></div>${mission?`<div class="card"><div class="sectiontitle">🎯 Missão extra</div><div class="row"><div><b>${mission.text}</b><div class="muted">+${mission.xp} XP · +${mission.coins} 🪙</div></div><button class="primary" onclick="completeMission()">Concluir</button></div></div>`:''}<div class="card"><div class="sectiontitle">📊 Resumo</div><div class="statsgrid"><div class="stat"><small>DIAS COMPLETOS</small><strong>${completeCount()}</strong></div><div class="stat"><small>XP</small><strong>⭐ ${fmt(data.xp)}</strong></div><div class="stat"><small>MOEDAS</small><strong>🪙 ${fmt(data.coins)}</strong></div><div class="stat"><small>MELHOR SEQUÊNCIA</small><strong>🔥 ${st.best}</strong></div></div></div>`}
function levelName(l){return ['Primeiro passo','Começando','Consistente','Disciplinado','Guerreiro','Elite','Imparável','Veterano','Lendário','Mestre'][Math.min(l-1,9)]||'Lendário'}
function saveToday(){if(!data.startDate)data.startDate=today();let vals={};for(const x of active()){let v=Math.max(0,parseInt(document.getElementById('ex_'+x.id)?.value||0));vals[x.id]=v}let complete=req().every(x=>vals[x.id]>=targetFor(x));let prev=data.entries[today()];let baseXp=0;for(const x of active())baseXp+=vals[x.id];let xp=baseXp+(complete?100:0),coins=(complete?30:10);if(data.upgrades.double){xp*=2;delete data.upgrades.double;}if(prev?.complete){toast('Treino de hoje já está registrado.');return}data.entries[today()]={values:vals,complete,protected:false,xp,coins,updatedAt:new Date().toISOString()};if(complete)award(xp,coins,'Treino completo');else award(xp,coins,'Treino parcial');checkAchievements();toast(complete?'🔥 Dia completo!':'Treino salvo — falta fechar os obrigatórios.');render()}
function clearToday(){delete data.entries[today()];save();render()}
function missionToday(){if(!data.settings.mission||data.missions[today()]?.done)return null;let x=active()[0];if(!x)return null;return {id:'extra',text:`Faça ${targetFor(x)+5} ${x.name.toLowerCase()}.`,xp:50,coins:15}}
function completeMission(){let m=missionToday();if(!m)return;data.missions[today()]={done:true};award(m.xp,m.coins,'Missão extra');toast('🎯 Missão concluída!');render()}
function renderStats(){let el=document.getElementById('stats'), entries=Object.entries(data.entries).sort((a,b)=>a[0].localeCompare(b[0]));let last=entries.slice(-14);let max=1;let pts=last.map(([d,e])=>{let total=Object.values(e.values||{}).reduce((a,b)=>a+b,0);max=Math.max(max,total);return[d,total]});let line=svgLine(pts,max);let byEx={};active().forEach(x=>byEx[x.id]=Object.values(data.entries).reduce((s,e)=>s+(e.values?.[x.id]||0),0));el.innerHTML=`<div class="card"><div class="sectiontitle">📊 Visão geral</div><div class="statsgrid"><div class="stat"><small>DIAS REGISTRADOS</small><strong>${entries.length}</strong></div><div class="stat"><small>DIAS COMPLETOS</small><strong>${completeCount()}</strong></div><div class="stat"><small>XP TOTAL</small><strong>⭐ ${fmt(data.xp)}</strong></div><div class="stat"><small>MOEDAS</small><strong>🪙 ${fmt(data.coins)}</strong></div><div class="stat"><small>SEQUÊNCIA ATUAL</small><strong>🔥 ${streak().cur}</strong></div><div class="stat"><small>MELHOR SEQUÊNCIA</small><strong>🏆 ${streak().best}</strong></div></div></div><div class="card"><div class="sectiontitle">📈 Volume diário — últimos ${last.length} registros</div><div class="chart">${line}</div></div><div class="card"><div class="sectiontitle">🏋️ Volume por exercício</div><div class="list">${active().map(x=>`<div class="row"><span>${x.icon} ${esc(x.name)}</span><b>${fmt(byEx[x.id])} ${x.type==='time'?'s':'reps'}</b></div>`).join('')}</div></div><div class="card"><div class="sectiontitle">📅 Consistência</div><div class="statsgrid"><div class="stat"><small>TAXA DE DIAS COMPLETOS</small><strong>${entries.length?Math.round(completeCount()/entries.length*100):0}%</strong></div><div class="stat"><small>DIAS PARCIAIS</small><strong>${entries.filter(x=>!x[1].complete&&!x[1].protected).length}</strong></div><div class="stat"><small>DIAS PROTEGIDOS</small><strong>${entries.filter(x=>x[1].protected).length}</strong></div><div class="stat"><small>MISSÕES EXTRAS</small><strong>${Object.values(data.missions).filter(x=>x.done).length}</strong></div></div></div><div class="card"><div class="sectiontitle">📆 Calendário</div>${calendar()}</div>`}
function svgLine(points,max){if(!points.length)return '<div class="muted">Ainda não há dados suficientes.</div>';let w=700,h=190,p=22;let path=points.map((x,i)=>{let X=p+i*(w-2*p)/Math.max(1,points.length-1),Y=h-p-(x[1]/max)*(h-2*p);return(i?'L':'M')+X.toFixed(1)+' '+Y.toFixed(1)}).join(' ');let dots=points.map((x,i)=>{let X=p+i*(w-2*p)/Math.max(1,points.length-1),Y=h-p-(x[1]/max)*(h-2*p);return`<circle cx="${X}" cy="${Y}" r="4" fill="#8b5cf6"/>`}).join('');return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="M${p} ${h-p}H${w-p}" stroke="#263247"/><path d="${path}" fill="none" stroke="#8b5cf6" stroke-width="3"/>${dots}</svg>`}
function calendar(){let now=dateObj(today()),start=new Date(now.getFullYear(),now.getMonth(),1),days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),out='<div class="calendar">';for(let i=0;i<start.getDay();i++)out+='<div></div>';for(let d=1;d<=days;d++){let s=new Date(now.getFullYear(),now.getMonth(),d).toLocaleDateString('en-CA'),e=data.entries[s];let c=e?.complete?'done':e?.protected?'protect':e?'partial':'';if(s===today())c+=' today';out+=`<div class="calday ${c}">${d}</div>`}return out+'</div>'}
const ACH=[['🚀','Primeiro passo','Complete 1 dia',()=>completeCount()>=1],['🔥','Uma semana','7 dias completos',()=>completeCount()>=7],['🔥','Duas semanas','14 dias consecutivos',()=>streak().best>=14],['🏆','30 dias','30 dias completos',()=>completeCount()>=30],['💯','500 repetições','500 reps acumuladas',()=>Object.values(data.entries).reduce((s,e)=>s+Object.values(e.values||{}).reduce((a,b)=>a+b,0),0)>=500],['⭐','1.000 XP','Acumule 1.000 XP',()=>data.xp>=1000],['👑','30 seguidos','30 dias consecutivos',()=>streak().best>=30],['🎯','10 missões','Complete 10 missões extras',()=>Object.values(data.missions).filter(x=>x.done).length>=10],['🏋️','Variedade','Tenha 5 exercícios ativos',()=>active().length>=5]];
function renderAchievements(){document.getElementById('achievements').innerHTML=`<div class="card"><div class="sectiontitle">🏆 Conquistas</div><div class="achgrid">${ACH.map(a=>`<div class="achievement ${a[3]()?'':'lock'}"><span style="font-size:25px">${a[0]}</span><div><b>${a[1]}</b><div class="muted">${a[2]}</div></div></div>`).join('')}</div></div>`}
const ITEMS={shield:{icon:'🛡️',name:'Proteção de sequência',price:150,desc:'Protege um dia sem treino e mantém a sequência.'},rest:{icon:'💤',name:'Dia de descanso',price:100,desc:'Marca hoje como descanso planejado.'},reroll:{icon:'🔄',name:'Rerrolar missão',price:50,desc:'Troca a missão extra do dia.'},double:{icon:'⭐',name:'XP em dobro',price:200,desc:'Duplica o XP do próximo treino completo.'}};
function renderShop(){let inv=Object.entries(data.inventory).reduce((s,[k,v])=>s+v,0);document.getElementById('shop').innerHTML=`<div class="card"><div class="sectiontitle">🏪 Loja</div><div class="statsgrid"><div class="stat"><small>SUAS MOEDAS</small><strong>🪙 ${fmt(data.coins)}</strong></div><div class="stat"><small>ITENS</small><strong>🎒 ${inv}</strong></div></div></div><div class="card"><div class="shopgrid">${Object.entries(ITEMS).map(([id,it])=>`<div class="shop"><div style="font-size:28px">${it.icon}</div><b>${it.name}</b><div class="muted">${it.desc}</div><div class="price">🪙 ${it.price}</div><button class="primary" onclick="buy('${id}')">Comprar</button></div>`).join('')}</div></div><div class="card"><div class="sectiontitle">🎒 Inventário</div><div class="list">${Object.entries(ITEMS).map(([id,it])=>`<div class="row"><span>${it.icon} ${it.name}</span><span class="badge">${data.inventory[id]||0}</span></div>`).join('')}</div></div>`}
function buy(id){let it=ITEMS[id];if(data.coins<it.price){toast('🪙 Moedas insuficientes.');return}data.coins-=it.price;data.inventory[id]=(data.inventory[id]||0)+1;save();toast(`${it.icon} Item comprado!`);render()}
function useItem(id){if(!(data.inventory[id]>0)){toast('Você não possui esse item.');return}if(id==='shield'){if(data.entries[today()]){toast('Registre proteção antes de um treino neste dia.');return}data.entries[today()]={values:{},complete:false,protected:true,xp:0,coins:0};data.inventory[id]--}else if(id==='rest'){data.entries[today()]={values:{},complete:true,protected:true,xp:0,coins:0,rest:true};data.inventory[id]--}else if(id==='reroll'){if(data.missions[today()])delete data.missions[today()];data.inventory[id]--}else if(id==='double'){data.inventory[id]--;data.upgrades.double=true}save();toast('Item usado!');render()}
function renderProfile(){let l=levelInfo(),s=streak();document.getElementById('profile').innerHTML=`<div class="card hero"><div class="eyebrow">Meu perfil</div><div class="day">Nível ${l.lv}</div><div class="muted">${levelName(l.lv)} · Prestígio ${data.prestige}</div><div class="bar"><i style="width:${l.within/l.need*100}%"></i></div><div class="barline"><span>${l.within} / ${l.need} XP</span><span>⭐ ${fmt(data.xp)}</span></div></div><div class="card"><div class="sectiontitle">📊 Seus números</div><div class="statsgrid"><div class="stat"><small>SEQUÊNCIA ATUAL</small><strong>🔥 ${s.cur}</strong></div><div class="stat"><small>MELHOR SEQUÊNCIA</small><strong>🏆 ${s.best}</strong></div><div class="stat"><small>MOEDAS</small><strong>🪙 ${fmt(data.coins)}</strong></div><div class="stat"><small>CONQUISTAS</small><strong>🏆 ${ACH.filter(a=>a[3]()).length}/${ACH.length}</strong></div></div></div><div class="card"><div class="sectiontitle">🎒 Inventário</div><div class="list">${Object.entries(ITEMS).map(([id,it])=>`<div class="row"><span>${it.icon} ${it.name}</span><button class="secondary" onclick="useItem('${id}')">Usar (${data.inventory[id]||0})</button></div>`).join('')}</div></div><div class="card"><div class="sectiontitle">👑 Prestígio</div><div class="muted">Ao chegar ao nível 50, você poderá converter a jornada em um novo prestígio, mantendo histórico, conquistas e estatísticas.</div></div>`}
function renderSettings(){document.getElementById('settings').innerHTML=`<div class="card"><div class="sectiontitle">🏋️ Exercícios</div><div class="list">${data.exercises.map(x=>`<div class="row"><span>${x.icon} <b>${esc(x.name)}</b><div class="muted">${x.target}${x.type==='time'?'s':' reps'} · +${x.inc}</div></span><span><button class="secondary" onclick="editExercise('${x.id}')">Editar</button> <button class="secondary" onclick="toggleExercise('${x.id}')">${x.active?'Desativar':'Ativar'}</button></span></div>`).join('')}</div><button class="primary" style="margin-top:10px" onclick="editExercise()">＋ Novo exercício</button></div><div class="card"><div class="sectiontitle">⚙️ Regras</div><label class="muted">Dias por nível</label><input id="daysLevel" type="number" min="1" value="${data.cfg.daysPerLevel}"><button class="primary" style="margin-top:10px" onclick="saveRule()">Salvar regra</button></div><div class="card"><div class="sectiontitle">💾 Dados</div><div class="actions"><button class="secondary" onclick="exportData()">⬇️ Exportar backup</button><label class="secondary" style="display:inline-block">⬆️ Importar <input id="importFile" type="file" accept="application/json" onchange="importData(event)" style="display:none"></label></div></div>`}
function saveRule(){data.cfg.daysPerLevel=Math.max(1,parseInt(document.getElementById('daysLevel').value)||5);save();toast('Regra salva.');render()}
function toggleExercise(id){let x=data.exercises.find(e=>e.id===id);x.active=!x.active;save();render()}
function editExercise(id){let x=id?data.exercises.find(e=>e.id===id):{id:'ex_'+Date.now(),name:'',icon:'🏋️',type:'reps',target:10,inc:2,active:true,required:true};document.getElementById('modalbox').innerHTML=`<h2>${id?'✏️ Editar':'➕ Novo'} exercício</h2><div class="formgrid"><div class="full"><label>Nome</label><input id="f_name" value="${esc(x.name)}"></div><div><label>Ícone</label><input id="f_icon" value="${esc(x.icon)}"></div><div><label>Tipo</label><select id="f_type"><option value="reps" ${x.type==='reps'?'selected':''}>Repetições</option><option value="time" ${x.type==='time'?'selected':''}>Tempo (segundos)</option></select></div><div><label>Meta inicial</label><input id="f_target" type="number" min="1" value="${x.target}"></div><div><label>Aumento</label><input id="f_inc" type="number" min="0" value="${x.inc}"></div><div><label>Obrigatório?</label><select id="f_req"><option value="1" ${x.required?'selected':''}>Sim</option><option value="0" ${!x.required?'selected':''}>Não</option></select></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveExercise('${id||''}')">Salvar</button></div>`;openModal()}
function saveExercise(id){let x=id?data.exercises.find(e=>e.id===id):{id:'ex_'+Date.now()};x.name=document.getElementById('f_name').value.trim()||'Exercício';x.icon=document.getElementById('f_icon').value.trim()||'🏋️';x.type=document.getElementById('f_type').value;x.target=Math.max(1,parseInt(document.getElementById('f_target').value)||1);x.inc=Math.max(0,parseInt(document.getElementById('f_inc').value)||0);x.required=document.getElementById('f_req').value==='1';x.active=true;if(!id)data.exercises.push(x);save();closeModal();render()}
function openSettings(){go('settings')};function openModal(){document.getElementById('modal').classList.add('open')};function closeModal(){document.getElementById('modal').classList.remove('open')}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='desafio-diario-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data=normalize(JSON.parse(r.result));save();toast('Backup restaurado.');render()}catch{toast('Backup inválido.')}};r.readAsText(f)}
function checkAchievements(){save()};function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
