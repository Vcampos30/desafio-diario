function today(){return new Date().toLocaleDateString('en-CA')}

function active(){return data.exercises.filter(e=>e.active)}
function req(){return active().filter(e=>e.required)}

function totalExercise(id){return Object.values(data.entries).reduce((s,e)=>s+Number(e.values?.[id]||0),0)}
function challengeWins(){return Object.values(data.challenges).reduce((s,r)=>s+Object.values(r.claimed||{}).filter(x=>x.done).length,0)}
function streak(){let ds=Object.keys(data.entries).filter(k=>data.entries[k].complete||data.entries[k].protected).sort(),set=new Set(ds),cur=0,best=0;if(!ds.length)return{cur:0,best:0};let d=today();while(set.has(d)){cur++;d=addDays(d,-1)}for(const x of ds){let c=1;while(set.has(addDays(x,c)))c++;best=Math.max(best,c)}return{cur,best}}

function rewardForHistorical(vals,complete,ds){let baseXp=Object.values(vals).reduce((a,b)=>a+Number(b||0),0),rc=req().length;return{xp:baseXp+(complete?100+Math.max(0,rc-2)*25:0),coins:0}}
function openDayEditor(ds){
  if(dateObj(ds)>dateObj(today())){toast('📅 Dias futuros ainda não podem ser registrados.');return}
  const e=data.entries[ds]||{values:{},complete:false};
  const past=ds<today();
  const title=past?'🕘 Ajustar dia anterior':'✏️ Ajustar treino de hoje';
  document.getElementById('modalbox').innerHTML=`<h2>${title}</h2><div class="muted">${formatDateLong(ds)} · ${past?'Registro retroativo: gera apenas o XP do treino, sem moedas, missão ou desafios extras.':'Você pode ajustar os valores de hoje. A missão diária continua exclusiva de hoje.'}</div><div class="exercisegrid" style="margin-top:14px">${active().map(x=>{let v=Number(e.values?.[x.id]||0),t=targetForDate(x,ds);return `<div class="exercise"><h3>${x.icon} ${esc(x.name)}</h3><div class="unit">Meta desse dia</div><div class="target">${fmt(t)} <span class="unit">${x.type==='time'?'segundos':'reps'}</span></div><input id="day_${x.id}" type="number" min="0" value="${v}" inputmode="numeric"></div>`}).join('')}</div><div class="locknote">🔒 Registro histórico: nenhum desafio extra e nenhuma moeda será concedida por este ajuste.</div><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveDayEditor('${ds}')">Salvar registro</button></div>`;openModal()
}
function formatDateLong(ds){return dateObj(ds).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}
function saveDayEditor(ds){
  let vals={};
  for(const x of active()){vals[x.id]=Math.max(0,parseInt(document.getElementById('day_'+x.id)?.value||0));}
  const complete=req().length>0&&req().every(x=>vals[x.id]>=targetForDate(x,ds));
  const prev=data.entries[ds];
  const reward=rewardForHistorical(vals,complete,ds);
  const oldXp=Number(prev?.xp||0);
  const deltaXp=reward.xp-oldXp;
  if(deltaXp){data.xp+=deltaXp;data.historyXP.push({date:ds,xp:deltaXp,reason:'Ajuste de registro'});}
  data.entries[ds]={values:vals,complete,protected:false,xp:reward.xp,coins:Number(prev?.coins||0),updatedAt:new Date().toISOString(),historical:ds<today()};
  if(!data.startDate||ds<data.startDate)data.startDate=ds;
  save();closeModal();toast(deltaXp>=0?`📅 Registro salvo · +${deltaXp} XP`:`📅 Registro ajustado · ${deltaXp} XP`);render();
}

function makeChallenge(kind,name,desc,items,xp,coins,icon,difficulty,tag){let signature=items.map(i=>i.x.id+':'+i.target).join('|');return{id:`${kind}_${signature}_${tag||''}`,kind,name,desc,items,xp,coins,icon,difficulty}}
function challengePool(){let xs=active(),r=req();if(!r.length)return[];let all=xs.length?xs:r, pick=()=>all[Math.floor(Math.random()*all.length)], mult=(x,p)=>Math.max(1,Math.round(targetFor(x)*p)),out=[];

function challengeHistory(){return Object.keys(data.challenges).sort().slice(-5).flatMap(d=>(data.challenges[d]?.list||[]).map(x=>x.id))}

an>· EVENTO MENSAL</span></div><div class="seasonBannerContent"><div class="seasonKicker">TEMPORADA ${se.roman}</div><h1>${esc(se.name)}</h1><div class="seasonMonth">${esc(se.short)}</div><p>${esc(se.tagline)}</p><div class="seasonHeroSigil">${se.art}</div></div><div class="seasonBannerFoot"><span>📅 ${se.start.slice(8,10)}–${se.end.slice(8,10)} ${se.short.split(' ')[0]}</span><span>⌛ ${remaining} DIAS RESTANTES</span><span>🏆 DIA ${st.elapsed||0} DA SUA JORNADA</span></div></section><div class="seasonStatsStrip"><div><span>PERÍODO</span><b>${se.start.slice(8,10)}–${se.end.slice(8,10)}</b></div><div><span>DISPONÍVEIS</span><b>${st.available} dias</b></div><div><span>INÍCIO</span><b>${st.join.slice(8,10)} ${se.short.split(' ')[0]}</b></div><div><span>DIAS FEITOS</span><b>${st.done}/${st.available}</b></div></div><section class="seasonPassLevel"><div class="seasonLevelBadge">${seasonLevel}</div><div class="seasonLevelInfo"><small>PASSE DA TEMPORADA</small><div class="seasonXPBar"><i style="width:${xpInLevel/250*100}%"></i></div><div class="seasonXPLabels"><span>Nível ${seasonLevel} · ${fmt(passXP)} XP sazonal</span><span>${xpInLevel}/250 XP</span></div></div><div class="seasonChest">🎁</div></section><div class="seasonTabs"><button class="${tab==='pass'?'active':''}" onclick="seasonTab('pass')">⚑ PASSE</button><button class="${tab==='missions'?'active':''}" onclick="seasonTab('missions')">⚔ MISSÕES</button><button class="${tab==='rewards'?'active':''}" onclick="seasonTab('rewards')">♜ RECOMPENSAS</button><button class="${tab==='history'?'active':''}" onclick="seasonTab('history')">▤ HISTÓRICO</button></div>${tab==='pass'?`<section class="seasonPanel"><div class="seasonPanelHeading"><h2>PASSE DA TEMPORADA</h2><p>Evolua, complete missões e desbloqueie relíquias exclusivas.</p></div><div class="seasonTrack">${rewardHTML}</div><div class="seasonTrackLine"><i style="width:${Math.min(100,st.done/Math.max(1,st.available)*100)}%"></i></div><div class="seasonMilestones"><span>INÍCIO</span><span>ASCENSÃO</span><span>RELÍQUIA FINAL</span></div></section><section class="seasonPanel"><div class="seasonPanelHeading"><h2>MISSÕES DA TEMPORADA</h2><p>Ganhe XP sazonal e moedas por cumprir objetivos especiais.</p></div>${missions}</section>`:tab==='missions'?`<section class="seasonPanel"><div class="seasonPanelHeading"><h2>MISSÕES ATIVAS</h2><p>As missões são válidas a partir da sua data de entrada.</p></div>${missions}<div class="seasonFootnote">Missões de teste podem ser verificadas novamente pelo modo Administrador.</div></section>`:tab==='rewards'?`<section class="seasonPanel"><div class="seasonPanelHeading"><h2>ARSENAL SAZONAL</h2><p>Recompensas exclusivas de ${esc(se.name)}.</p></div><div class="seasonRewardGrid">${rewardHTML}</div></section>`:`<section class="seasonPanel"><div class="seasonPanelHeading"><h2>ARQUIVO DAS TEMPORADAS</h2><p>Eventos anteriores ficam registrados no seu legado.</p></div>${history}</section>`}<div class="seasonFootnote">Os dias anteriores à sua entrada (${st.join}) não pontuam e não podem ser recuperados. O progresso sazonal é independente do XP permanente.</div></div>`}
function claimSeasonMission(i){let se=currentSeason(),st=seasonDateInfo(se),m=se.missions[i],key='m'+i;if(st.rec.missions[key]){toast('Missão já concluída nesta temporada.');return}if(i===0){let e=data.entries[today()];if(!e?.complete){toast('Complete o treino diário para concluir esta missão.');return}}else if(i===1){let count=Object.keys(data.entries||{}).filter(ds=>ds>=st.join&&ds<=today()&&ds>=se.start&&ds<=se.end&&data.entries[ds]?.complete).length;if(count<Math.min(5,Math.ceil(st.available*.25))){toast('Ainda faltam dias de treino para esta missão.');return}}else if(i===2){let ch=Object.values(data.challenges||{}).flat().some(x=>x?.done||x?.completed);if(!ch){toast('Conclua um desafio extra primeiro.');return}}st.rec.missions[key]=true;st.rec.xp=(Number(st.rec.xp)||0)+Number(m[2]||0);data.coins+=Number(m[3]||0);save();renderSeason();toast(`🏆 Missão concluída! +${m[2]} XP sazonal.`)}
function renderProfile(){let l=levelInfo(),s=streak(),items=ITEMS(),effects=Object.keys(data.upgrades).filter(k=>data.upgrades[k]),season=proSeasonStatus();let themeOptions=[['skull','☠️','Skull'],['blood','🩸','Blood'],['ember','🔥','Ember'],['ice','❄️','Ice']];document.getElementById('profile').innerHTML=`<div class="card hero heroSkull"><div class="eyebrow">Meu perfil</div><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><div class="day">☠️ Nível ${l.lv}</div><div class="muted">${levelName(l.lv)} · Prestígio ${data.prestige} · Foco: ${esc(data.settings.goal||'Consistência')}</div></div><span class="proState ${isPro()?'proActive':''}">${isPro()?'☠️ PRO':'FREE'}</span></div><div class="bar"><i style="width:${l.within/l.need*100}%"></i></div><div class="barline"><span>${l.within} / ${l.need} XP</span><span>⭐ ${fmt(data.xp)}</span></div></div><div class="card proCard"><div class="proHead"><div><div class="proBadge">☠️ ${isPro()?'PRO ATIVO':'PRO'}</div><div class="sectiontitle" style="margin-top:8px">${isPro()?'Tudo desbloqueado na demonstração':'Pronto para evoluir'}</div><div class="muted">${isPro()?'Motor premium, insights, temporada e personalização estão ativos localmente.':'Desbloqueie a camada comercial do produto sem perder o modo gratuito.'}</div></div><button class="promoButton" onclick="showProModal()">${isPro()?'Gerenciar':'Conhecer'}</button></div>${isPro()?`<div class="season" style="margin-top:12px"><div><b>🏁 Temporada Skull I</b><div class="seasonProgress">${season.prog}% concluído · ${Math.min(30,season.elapsed)}/30 dias</div></div><span class="badge">${data.pro.plan?proProductLabel(data.pro.plan):'PRO'}</span></div><div class="card" style="margin:12px 0 0;background:#111114"><div class="sectiontitle">🎨 Personalização PRO</div><div class="muted">Escolha a identidade visual premium deste aparelho.</div><div class="themeGrid">${themeOptions.map(t=>`<button class="themeBtn ${data.pro.theme===t[0]?'active':''}" onclick="setProTheme('${t[0]}')"><span class="themeDot" style="background:${t[0]==='skull'?'linear-gradient(135deg,#ef4444,#450a0a)':t[0]==='blood'?'linear-gradient(135deg,#dc2626,#3b060b)':t[0]==='ember'?'linear-gradient(135deg,#fbbf24,#c2410c)': 'linear-gradient(135deg,#67e8f9,#075985)'};box-shadow:0 0 16px ${t[0]==='skull'?'rgba(239,68,68,.28)':t[0]==='blood'?'rgba(220,38,38,.28)':t[0]==='ember'?'rgba(249,115,22,.28)':'rgba(56,189,248,.28)'}"></span><b>${t[1]} ${t[2]}</b></button>`).join('')}</div></div><div class="syncBox" style="margin-top:12px"><b>☁️ Sincronização</b><div class="muted" style="margin:4px 0 8px">Hoje: ${data.pro.lastSyncAt?new Date(data.pro.lastSyncAt).toLocaleString('pt-BR'):'nunca simulada'}</div><code>store.kit → subscription state → cloud profile → Apple/iCloud adapter</code><button class="secondary" style="margin-top:9px" onclick="syncSnapshot()">Simular sincronização</button></div>`:''}</div><div class="card"><div class="sectiontitle">📊 Seus números</div><div class="statsgrid"><div class="stat"><small>SEQUÊNCIA ATUAL</small><strong>🔥 ${s.cur}</strong></div><div class="stat"><small>MELHOR</small><strong>🏆 ${s.best}</strong></div><div class="stat"><small>MOEDAS</small><strong>🪙 ${fmt(data.coins)}</strong></div><div class="stat"><small>CONQUISTAS</small><strong>🏆 ${ACH.filter(a=>a[4]()).length}/${ACH.length}</strong></div></div></div><div class="card"><div class="sectiontitle">🎒 Inventário</div><div class="list">${Object.entries(items).filter(([id])=>data.inventory[id]>0).map(([id,it])=>`<div class="row"><span>${it.icon} ${it.name} <span class="badge">${data.inventory[id]}</span></span><button class="secondary" onclick="useItem('${id}')">Usar</button></div>`).join('')||'<div class="muted">Inventário vazio. A loja está esperando.</div>'}</div></div><div class="card"><div class="sectiontitle">⚡ Efeitos ativos</div><div class="list">${effects.map(k=>`<div class="row"><span>✨ ${k}</span><span class="badge">ativo</span></div>`).join('')||'<div class="muted">Nenhum efeito ativo.</div>'}</div></div>`}

function askDevPassword(){const p=prompt('Digite a senha de desenvolvedor:');return p===DEV_PASSWORD}
function toggleDeveloperAccess(){if(devUnlocked()){if(!confirm('Revogar o acesso permanente de desenvolvedor e voltar a bloquear o conteúdo PRO?'))return;data.dev.unlocked=false;save();applyProTheme();render();toast('🔒 Acesso de desenvolvedor revogado.');return}if(!askDevPassword()){toast('❌ Senha incorreta.');return}data.dev.unlocked=true;data.pro.season.startedAt=data.pro.season.startedAt||new Date().toISOString();save();applyProTheme();render();toast('☠️ Conteúdo de desenvolvedor liberado permanentemente neste aparelho.')}
function enterAdminMode(){if(adminSession.active){toast('🛠️ Modo Administrador já está ativo.');return}if(!askDevPassword()){toast('❌ Senha incorreta.');return}adminSession={active:true,snapshot:clone(data),proOverride:null};render();toast('🛠️ Modo Administrador ativado.')}
function exitAdminMode(restore=false){if(!adminSession.active)return;if(restore&&adminSession.snapshot){data=clone(adminSession.snapshot);save();}adminSession={active:false,snapshot:null,proOverride:null};if(currentView==='season'&&!isPro())currentView='profile';render();toast(restore?'↩️ Alterações de teste desfeitas.':'✅ Modo Administrador encerrado.')}
function adminAddCoins(n){if(!requireAdmin())return;data.coins=Math.max(0,Number(data.coins||0)+n);save();render();toast(`🪙 ${n>=0?'+':''}${fmt(n)} moedas.`)}
function adminSetCoins(){if(!requireAdmin())return;let n=Math.max(0,parseInt(prompt('Defina o saldo de moedas:',String(data.coins||0))||0));data.coins=n;save();render();toast(`🪙 Saldo definido: ${fmt(n)}.`)}

function adminSetXP(){if(!requireAdmin())return;let n=Math.max(0,parseInt(prompt('Defina o XP total:',String(data.xp||0))||0));data.xp=n;save();render();toast(`⭐ XP definido: ${fmt(n)}.`)}
function adminGiveItem(){if(!requireAdmin())return;const items=ITEMS();const names=Object.entries(items).map(([id,it])=>`${id} — ${it.name}`).join('\n');const id=prompt(`ID do item para adicionar:\n\n${names}`);if(!id||!items[id]){toast('Item não encontrado.');return}const qty=Math.max(1,parseInt(prompt('Quantidade:', '1')||'1'));data.inventory[id]=(data.inventory[id]||0)+qty;save();render();toast(`${items[id].icon} +${qty} ${items[id].name}.`)}
function adminSimulateDays(){if(!requireAdmin())return;let n=Math.max(1,Math.min(90,parseInt(prompt('Quantos dias completos deseja simular?', '7')||'7')));for(let i=n-1;i>=0;i--){let ds=addDays(today(),-i),vals={};for(const x of active())vals[x.id]=targetForDate(x,ds);let xp=Object.values(vals).reduce((a,b)=>a+Number(b||0),0)+100+Math.max(0,req().length-2)*25;data.entries[ds]={values:vals,complete:true,protected:false,xp,coins:30+Math.max(0,active().length-2)*5,updatedAt:new Date().toISOString(),adminSimulated:true};}if(!data.startDate||addDays(today(),-(n-1))<data.startDate)data.startDate=addDays(today(),-(n-1));data.xp=Object.values(data.entries).reduce((a,e)=>a+Number(e.xp||0),0);data.coins=Math.max(data.coins,Object.values(data.entries).reduce((a,e)=>a+Number(e.coins||0),0));save();render();toast(`🧪 ${n} dias simulados.`)}
function adminUnlockAll(){if(!requireAdmin())return;data.dev.unlocked=true;data.pro.status='active';data.pro.source='admin';data.pro.plan='lifetime';data.pro.startedAt=data.pro.startedAt||new Date().toISOString();data.pro.season.startedAt=data.pro.season.startedAt||new Date().toISOString();save();render();toast('☠️ Conteúdo e PRO liberados para teste.')}
function adminGenerateChallenges(){if(!requireAdmin())return;delete data.challenges[today()];challengeDefs();save();render();toast('🎯 Novos desafios gerados.')}
function adminResetEconomy(){if(!requireAdmin())return;data.coins=0;data.inventory={};data.upgrades={};save();render();toast('🧹 Economia resetada.')}
function adminResetSeason(){if(!requireAdmin())return;data.pro.season={id:'skull_01',startedAt:new Date().toISOString(),xp:0};save();if(!isPro())currentView='profile';render();toast('🏁 Temporada resetada.')}
function adminSetProOverride(mode){if(!requireAdmin())return;adminSession.proOverride=mode==='free'?'free':mode==='pro'?'pro':null;if(adminSession.proOverride==='pro'){data.pro.season.startedAt=data.pro.season.startedAt||new Date().toISOString()}render();toast(mode==='free'?'🧪 Simulação FREE ativa.':'☠️ Simulação PRO ativa.')}
function renderAdminPanel(){const locked=!devUnlocked();if(locked)return `<div class="card"><div class="sectiontitle">🛠️ Acesso de desenvolvedor</div><div class="muted">Libere permanentemente temas, conteúdo premium e recursos futuros para este aparelho. Depois, o Modo Administrador fica disponível separadamente para testes.</div><div class="adminNotice" style="margin-top:10px">🔐 A senha é apenas uma barreira de desenvolvimento local. Como o app roda no navegador, ela não é segurança real contra alguém com acesso ao código.</div><button class="primary" style="margin-top:10px;width:100%" onclick="toggleDeveloperAccess()">☠️ Desbloquear conteúdo de desenvolvedor</button></div>`;return `<div class="card proCard"><div class="sectiontitle">🛠️ Centro de Desenvolvimento</div><div class="adminNotice"><span class="devUnlocked">● Conteúdo de desenvolvedor desbloqueado permanentemente</span><br>Temas, PRO e novos recursos premium ficam acessíveis neste aparelho.</div>${adminSession.active?`<div class="adminBanner" style="margin-top:10px"><span>🛠️ <b>MODO ADMINISTRADOR ATIVO</b><br>Alterações abaixo são de teste.</span><button class="secondary" onclick="exitAdminMode(false)">Sair</button></div><div class="adminGrid" style="margin-top:10px"><div class="adminTool"><h4>🪙 Economia</h4><div class="muted">Saldo: <b>${fmt(data.coins)}</b></div><div class="actions"><button class="secondary" onclick="adminAddCoins(1000)">+1K</button><button class="secondary" onclick="adminAddCoins(10000)">+10K</button></div><div class="actions"><button class="secondary" onclick="adminAddCoins(-1000)">−1K</button><button class="secondary" onclick="adminSetCoins()">Definir</button></div></div><div class="adminTool"><h4>⭐ Progressão</h4><div class="muted">XP: <b>${fmt(data.xp)}</b> · Nível ${levelInfo().lv}</div><div class="actions"><button class="secondary" onclick="adminAddXP(500)">+500</button><button class="secondary" onclick="adminAddXP(5000)">+5K</button></div><div class="actions"><button class="secondary" onclick="adminAddXP(-500)">−500</button><button class="secondary" onclick="adminAddXP(-5000)">−5K</button></div><div class="actions"><button class="secondary" onclick="adminSetXP()">Definir XP</button><button class="secondary" onclick="adminSimulateDays()">+ dias</button></div></div><div class="adminTool"><h4>🎒 Loja</h4><div class="muted">Adicione qualquer item sem gastar moedas.</div><div class="actions"><button class="secondary" onclick="adminGiveItem()">Adicionar item</button><button class="secondary" onclick="adminAddCoins(1000000)">+1M 🪙</button></div></div><div class="adminTool"><h4>🎯 Desafios</h4><div class="muted">Regera os 3 desafios do dia.</div><div class="actions"><button class="secondary" onclick="adminGenerateChallenges()">Gerar novamente</button></div></div><div class="adminTool"><h4>🏁 Temporada</h4><div class="muted">Teste o fluxo premium sem esperar 30 dias.</div><div class="actions"><button class="secondary" onclick="adminResetSeason()">Resetar</button><button class="secondary" onclick="adminSetProOverride('pro')">PRO</button><button class="secondary" onclick="adminSetProOverride('free')">FREE</button></div></div><div class="adminTool"><h4>🧪 Conteúdo</h4><div class="muted">Libera tudo e força uma sessão PRO.</div><div class="actions"><button class="secondary" onclick="adminUnlockAll()">Liberar tudo</button><button class="secondary" onclick="adminResetEconomy()">Reset economia</button></div></div></div><div class="actions"><button class="secondary" style="flex:1" onclick="exitAdminMode(false)">✅ Sair mantendo alterações</button><button class="danger adminDanger" style="flex:1" onclick="exitAdminMode(true)">↩️ Sair e desfazer testes</button></div>`:`<div class="actions"><button class="primary" style="flex:1" onclick="enterAdminMode()">🛠️ Entrar no Modo Administrador</button></div><div class="commercialNote">O modo administrativo é temporário. Você pode testar moedas, XP, itens, progressão, desafios e temporada e depois sair sem afetar a lógica function resetProgress(){if(!confirm('Tem certeza que quer voltar todo o aplicativo para o marco zero?'))return;if(!confirm('Última confirmação: todo o progresso, exercícios personalizados, XP, moedas, desafios e histórico serão apagados.'))return;data=clone(defaultData);save();currentView='today';render();toast('🔄 Tudo voltou para o marco zero.')}
function saveRule(){data.cfg.daysPerLevel=Math.max(1,parseInt(document.getElementById('daysLevel').value)||5);save();toast('Regra salva.');render()}
function toggleExercise(id){let x=data.exercises.find(e=>e.id===id);if(x){x.active=!x.active;save();render()}}
function editExercise(id){let x=id?data.exercises.find(e=>e.id===id):{id:'ex_'+Date.now(),name:'',icon:'🏋️',type:'reps',target:10,inc:2,active:true,required:true};document.getElementById('modalbox').innerHTML=`<h2>${id?'✏️ Editar':'➕ Novo'} exercício</h2><div class="formgrid"><div class="full"><label>Nome</label><input id="f_name" value="${esc(x.name)}"></div><div><label>Ícone</label><input id="f_icon" value="${esc(x.icon)}"></div><div><label>Tipo</label><select id="f_type" onchange="toggleTimeField()"><option value="reps" ${x.type==='reps'?'selected':''}>Repetições</option><option value="time" ${x.type==='time'?'selected':''}>Tempo</option></select></div><div id="repTargetField"><label>Meta inicial</label><input id="f_target" type="number" min="1" value="${x.type==='reps'?x.target:10}"></div><div id="timeTargetField" style="display:${x.type==='time'?'block':'none'}"><label>Tempo inicial (segundos)</label><input id="f_time" type="number" min="1" value="${x.type==='time'?x.target:30}"></div><div><label>Aumento por nível</label><input id="f_inc" type="number" min="0" value="${x.inc}"></div><div><label>Obrigatório?</label><select id="f_req"><option value="1" ${x.required?'selected':''}>Sim</option><option value="0" ${!x.required?'selected':''}>Não</option></select></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveExercise('${id||''}')">Salvar</button></div>`;openModal()}
function toggleTimeField(){let time=document.getElementById('f_type').value==='time';document.getElementById('timeTargetField').style.display=time?'block':'none';document.getElementById('repTargetField').style.display=time?'none':'block'}
function saveExercise(id){let x=id?data.exercises.find(e=>e.id===id):{id:'ex_'+Date.now()};x.name=document.getElementById('f_name').value.trim()||'Exercício';x.icon=document.getElementById('f_icon').value.trim()||'🏋️';x.type=document.getElementById('f_type').value;x.target=Math.max(1,parseInt(x.type==='time'?document.getElementById('f_time').value:document.getElementById('f_target').value)||1);x.inc=Math.max(0,parseInt(document.getElementById('f_inc').value)||0);x.required=document.getElementById('f_req').value==='1';x.active=true;if(!id)data.exercises.push(x);save();closeModal();toast('Exercício salvo.');render()}
function openSettings(){go('settings')}function openModal(){document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='desafio-diario-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data=normalize(JSON.parse(r.result));save();toast('Backup restaurado.');render()}catch{toast('Backup inválido.')}};r.readAsText(f)}
function updateNav(){let n=document.getElementById('navin'),b=document.getElementById('navSeason'),ab=document.getElementById('adminBanner');if(n)n.classList.toggle('hasPro',isPro());if(b)b.style.display=isPro()?'block':'none';if(ab)ab.innerHTML=adminSession.active?'<div class="adminBanner">🛠️ <span><b>MODO ADMINISTRADOR</b> · sessão de testes ativa</span><button class="secondary" onclick="exitAdminMode(false)">Sair</button></div>':'';document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.v===currentView))}
function render(){renderToday();renderStats();renderAchievements();renderShop();renderChallenges();renderSeason();renderProfile();renderSettings();updateNav();if(isFreshInstall()&&!document.getElementById('modal').classList.contains('open'))showOnboarding()}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),2200)}
applyProTheme();render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
